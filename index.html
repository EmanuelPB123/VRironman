    <!-- IFRAME -->

    <!-- Overlay para Radio Garden -->
    <div id="radioOverlay" class="overlay">
        <div class="overlay-content">
            <button class="close-btn" onclick="closeOverlay('radioOverlay')">✖</button>
            <div class="iframe-container">
                <iframe src="https://radio.garden/visit/comodoro-rivadavia/gKayohHw" title="Radio Garden"

            </div>
        </div>
    </div>

    <!-- Escena -->

                <a-text value="R" color="#02797d" align="center" width="3" position="0 0 0"></a-text>

            </a-entity>


            <!-- Barra de búsqueda -->
            <a-entity position="-3 0.7 0">

                <a-text id="search-text" value="" color="#000" align="left" width="3.5" position="-1.8 0 0.03"></a-text>
                <a-entity id="search-button" position="1.8 0 0.03" class="clickable">

                </a-entity>

            <a-entity id="results-container" position="2 1.2 0" visible="false" scale="0.2 0.2 0.2" depth="0.2" color="#fff"></a-entity>

        <!-- camara -->
        <a-entity id="rig" position="0 1.6 0" flight-controls>
            <a-camera look-controls>
                <a-cursor color="#ff1e00" fuse="true" fuseTimeout="1500"></a-cursor>
                <!-- linterna -->
                <a-entity id="flashlight" light="type: spot; 
        color: #fff; 
        intensity: 0; 
        angle: 90; 
        penumbra: 0.2; 
        decay: 1;
        distance: 25;
        castShadow: true;
        shadowMapWidth: 1024;
        shadowMapHeight: 1024" position="0 0 0" rotation="0 0 0">
                </a-entity>
            </a-camera>
            <a-entity camera look-controls wasd-controls position="0 1.6 0">
                <a-entity cursor="fuse: true; fuseTimeout: 500" position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" material="color: black; shader: flat">
                    <a-animation begin="fusing" easing="ease-in" attribute="scale" dur="500" fill="forwards" from="1 1 1"
                        to="0.1 0.1 0.1"></a-animation>
                    <a-animation begin="click" easing="ease-in" attribute="scale" dur="150" fill="forwards"
                        from="0.1 0.1 0.1" to="1 1 1"></a-animation>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Cámara y controles -->


        <!-- Enhanced Lighting with new colors -->

        <a-light type="spot" color="#ffdb9d" intensity="1" position="0 4.4 0" angle="180" penumbra="0.1" distance="25"

            <a-sphere radius="0.1" color="#ffdb9d" material="emissive: #fff6dd; emissiveIntensity: 1.5"></a-sphere>
        </a-light>

                <a-text value="FLIGHT MODE" align="center" position="0 0.4 0.06" scale="0.5 0.5 0.5" color="#FFD700"
